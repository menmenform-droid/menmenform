<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO Repair Services | MBS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #004085; border-bottom: 2px solid #004085; padding-bottom: 10px; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .note { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-submit { background-color: #28a745; color: white; }
        .btn-submit:hover { background-color: #218838; }
        .btn-search { background-color: #007bff; color: white; margin-top: 10px; }
        .search-result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; display: none; }
        
        /* Layout untuk PDF A4 Half-Double */
        #pdf-content { display: none; width: 210mm; }
    </style>
</head>
<body>

<div class="container">
    <h2>CASIO CALCULATOR REPAIR SERVICES</h2>
    
    <div class="section">
        <div class="note">⚠️ NOTA: HANYA TERIMA CASIO YANG BELI DI MBS SAHAJA.</div>
        <form id="repairForm">
            <label>Cawangan (MBS):</label>
            <input type="text" id="branch" placeholder="Contoh: MBS Kuantan" required>
            
            <label>Nama Staff:</label>
            <input type="text" id="staff" placeholder="Nama penerima" required>
            
            <label>Calculator Model:</label>
            <input type="text" id="calcModel" placeholder="Contoh: fx-570EX / fx-991CW" required>
            
            <label>Nama Pelanggan:</label>
            <input type="text" id="custName" placeholder="Nama penuh" required>
            
            <label>No. Telefon:</label>
            <input type="text" id="custPhone" placeholder="012-3456789" required>
            
            <label>Alamat:</label>
            <textarea id="custAddress" rows="2" placeholder="Alamat pelanggan"></textarea>
            
            <button type="submit" class="btn-submit">SIMPAN & DOWNLOAD PDF</button>
        </form>
    </div>

    <hr>

    <div class="section">
        <h3>Semakan Status / Reprint</h3>
        <input type="text" id="searchId" placeholder="Masukkan RSF0000001">
        <button onclick="searchData()" class="btn-search">CARI DATA</button>
        
        <div id="searchResult" class="search-result">
            <p id="resStatus"></p>
            <button id="reprintBtn" class="btn-submit" style="background-color: #6c757d;">REPRINT PDF</button>
        </div>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxSQILLf9u9Jt8-wwVZwdiyk9z0v3NTQBIxjA6CVjgj_B9hw3wW-ccbvvIfFeU1y1Nrqw/exec';

    document.getElementById('repairForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.innerText = "Processing...";

        const data = {
            branch: document.getElementById('branch').value,
            staff: document.getElementById('staff').value,
            calcModel: document.getElementById('calcModel').value,
            custName: document.getElementById('custName').value,
            custPhone: document.getElementById('custPhone').value,
            custAddress: document.getElementById('custAddress').value
        };

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
        .then(res => res.json())
        .then(response => {
            alert('Data Berjaya Disimpan! ID: ' + response.id);
            generatePDF(response.id, data.custName, data.calcModel, "PENDING");
            e.target.reset();
            btn.disabled = false;
            btn.innerText = "SIMPAN & DOWNLOAD PDF";
        })
        .catch(err => {
            alert('Error!');
            console.error(err);
            btn.disabled = false;
        });
    });

    function searchData() {
        const id = document.getElementById('searchId').value;
        const resDiv = document.getElementById('searchResult');
        
        fetch(scriptURL + "?id=" + id)
        .then(res => res.json())
        .then(data => {
            if(data.result === "not_found") {
                alert("ID Tidak Dijumpai");
                resDiv.style.display = "none";
            } else {
                resDiv.style.display = "block";
                document.getElementById('resStatus').innerHTML = `
                    <strong>ID:</strong> ${data.id}<br>
                    <strong>Nama:</strong> ${data.name}<br>
                    <strong>Model:</strong> ${data.model}<br>
                    <strong>Status:</strong> <span style="color:blue">${data.status}</span>
                `;
                document.getElementById('reprintBtn').onclick = () => generatePDF(data.id, data.name, data.model, data.status);
            }
        });
    }

    function generatePDF(id, name, model, status) {
        const template = `
            <div style="display: flex; width: 210mm; font-family: Arial, sans-serif; padding: 10px; background: white;">
                ${[1, 2].map(i => `
                    <div style="flex: 1; border: 2px dashed #333; margin: 10px; padding: 20px; position: relative;">
                        <div style="text-align:center">
                            <h2 style="margin:0">MBS BOOKS & STATIONERY</h2>
                            <p style="font-size:12px">CASIO CALCULATOR REPAIR SERVICES</p>
                            <p style="font-size:10px; background:#000; color:#fff; display:inline-block; padding:2px 10px;">
                                ${i === 1 ? 'CUSTOMER COPY' : 'SHOP COPY'}
                            </p>
                        </div>
                        <hr>
                        <div style="font-size: 14px; line-height: 1.6;">
                            <p><strong>REPAIR NO:</strong> <span style="font-size: 20px; font-family: monospace;">${id}</span></p>
                            <p><strong>DATE:</strong> ${new Date().toLocaleDateString('ms-MY')}</p>
                            <p><strong>MODEL:</strong> ${model}</p>
                            <p><strong>CUSTOMER:</strong> ${name}</p>
                            <p><strong>STATUS:</strong> ${status}</p>
                        </div>
                        <br>
                        <div style="margin-top:20px; border-top: 1px solid #000; padding-top:10px; font-size:10px;">
                            * Sila bawa resit ini semasa menuntut kalkulator anda.<br>
                            * Nota: Casio yang dibeli di MBS sahaja diterima.
                        </div>
                    </div>
                `).join('')}
            </div>
        `;

        const opt = {
            margin: 0,
            filename: id + '_MBS_Repair.pdf',
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };

        html2pdf().from(template).set(opt).save();
    }
</script>

</body>
</html>
