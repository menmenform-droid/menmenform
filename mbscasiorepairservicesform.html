<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASIO Repair System | MBS</title>

<style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: #f1f3f5;
    padding: 20px;
    color: #333;
}

/* ===== FORM UI ===== */
.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    color: #004085;
    border-bottom: 3px solid #004085;
    padding-bottom: 10px;
}

.section {
    margin-bottom: 30px;
    padding: 20px;
    border: 1px solid #dee2e6;
    border-radius: 8px;
}

.note {
    background: #ffc107;
    padding: 10px;
    font-weight: bold;
    text-align: center;
    border-radius: 5px;
    margin-bottom: 15px;
}

label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}

.btn-submit { background: #28a745; color: white; }
.btn-submit:hover { background: #218838; }
.btn-submit:disabled { background: #6c757d; cursor: not-allowed; }

.btn-search { background: #007bff; color: white; }
.btn-search:hover { background: #0069d9; }

/* ===== PRINT AREA ===== */
#printArea {
    display: none;
    width: 297mm;
    height: 210mm;
    background: white;
}

.copy {
    width: 50%;
    padding: 15mm;
    box-sizing: border-box;
}

.divider {
    border-right: 1px dashed #000;
}

/* ===== PRINT RULE ===== */
@media print {
    @page { size: landscape; margin: 0; }
    body { padding: 0; background: white; }
    .container { display: none !important; }
    #printArea { display: flex !important; }
}
</style>
</head>

<body>

<div class="container">
    <h2>CASIO Repair Services Form</h2>

    <div class="section">
        <div class="note">⚠️ NOTA: SEMUA RUANGAN WAJIB DIISI</div>

        <form id="repairForm">
            <label>Cawangan MBS</label>
            <input id="branch" type="text" placeholder="Contoh: MBS Kuantan" required>

            <label>Staff Bertugas</label>
            <input id="staff" type="text" placeholder="Nama staff" required>

            <label>Model Kalkulator</label>
            <input id="model" type="text" placeholder="Contoh: fx-570MS / fx-991CW" required>

            <label>Nama Pelanggan</label>
            <input id="name" type="text" placeholder="Nama penuh pelanggan" required>

            <label>No Telefon Pelanggan</label>
            <input id="phone" type="text" placeholder="Contoh: 0123456789" required>

            <label>Masalah Spesifik (Kerosakan)</label>
            <textarea id="issue" rows="2" placeholder="Contoh: Skrin pudar, Butang 'ON' tak berfungsi, No 5 tak boleh tekan" required></textarea>

            <label>Alamat Lengkap Pelanggan</label>
            <textarea id="address" rows="2" placeholder="Alamat untuk rujukan" required></textarea>

            <button type="submit" class="btn-submit" id="submitBtn">SIMPAN & CETAK</button>
        </form>
    </div>

    <div class="section">
        <h3>Carian & Reprint</h3>
        <input id="searchId" placeholder="Masukkan RSF0000001">
        <button class="btn-search" onclick="searchData()" id="searchBtn">CARI & CETAK</button>
    </div>
</div>

<div id="printArea">
    <div class="copy divider" id="customerCopy"></div>
    <div class="copy" id="officeCopy"></div>
</div>

<script>
// Pastikan URL scriptURL ini adalah yang terkini dari Deployment Apps Script anda
const scriptURL = "https://script.google.com/macros/s/AKfycbxSQILLf9u9Jt8-wwVZwdiyk9z0v3NTQBIxjA6CVjgj_B9hw3wW-ccbvvIfFeU1y1Nrqw/exec";

document.getElementById("repairForm").addEventListener("submit", e => {
    e.preventDefault();
    
    const btn = document.getElementById("submitBtn");
    
    const data = {
        branch: document.getElementById("branch").value.trim(),
        staff: document.getElementById("staff").value.trim(),
        model: document.getElementById("model").value.trim(),
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        issue: document.getElementById("issue").value.trim(),
        address: document.getElementById("address").value.trim()
    };

    if (Object.values(data).some(value => value === "")) {
        alert("Sila isi semua ruangan dengan lengkap!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Sila Tunggu, Sedang Menyimpan...";

    fetch(scriptURL, { method: "POST", body: JSON.stringify(data) })
    .then(res => res.json())
    .then(r => {
        printReceipt({
            id: r.id,
            ...data,
            status: "PENDING"
        });
        e.target.reset();
        btn.disabled = false;
        btn.innerText = "SIMPAN & CETAK";
    })
    .catch(err => {
        console.error(err);
        alert("Ralat! Gagal menyimpan data.");
        btn.disabled = false;
        btn.innerText = "SIMPAN & CETAK";
    });
});

                    style="width:75px;height:75px;border:1px solid #ddd;padding:2px;"
                    alt="QR Status"
                >
                <p style="margin:0;font-size:9px;color:#555;">Semak Status</p>
            </div>
        </div>
        
        <hr style="border:0;border-top:1px solid #000;margin:10px 0;">
        
        <table style="width:100%;font-size:13px;line-height:1.6;border-collapse:collapse;">
            <tr>
                <td style="width:35%;"><b>RSF NUMBER</b></td>
                <td>: <b style="font-size:16px;background:#eee;padding:2px 5px;">${d.id}</b></td>
            </tr>
            <tr><td><b>CAWANGAN</b></td><td>: ${d.branch}</td></tr>
            <tr><td><b>STAFF</b></td><td>: ${d.staff}</td></tr>
            <tr><td colspan="2" style="padding:5px 0;"><div style="border-top:1px dashed #ccc;"></div></td></tr>
            <tr><td><b>PELANGGAN</b></td><td>: ${d.name}</td></tr>
            <tr><td><b>NO. TELEFON</b></td><td>: ${d.phone}</td></tr>
            <tr><td><b>MODEL</b></td><td>: ${d.model}</td></tr>
            <tr><td><b>STATUS</b></td><td>: <span style="color:blue;font-weight:bold;">${d.status}</span></td></tr>
            <tr>
                <td valign="top"><b>KEROSAKAN</b></td>
                <td>: <b style="color:#d32f2f;">${d.issue}</b></td>
            </tr>
            <tr>
                <td valign="top"><b>ALAMAT</b></td>
                <td style="font-size:11px;line-height:1.2;">: ${d.address}</td>
            </tr>
        </table>
        
        <div style="margin-top:20px;font-size:10px;border-top:1px solid #000;padding-top:10px;font-style:italic;">
            Dicetak pada: ${new Date().toLocaleString("ms-MY")}<br>
            * Sila bawa salinan ini semasa menuntut barang anda.<br>
            * Barang yang tidak dituntut melebihi 3 bulan akan dilupuskan.
        </div>
    `;
}

function printReceipt(d) {
    document.getElementById("customerCopy").innerHTML = buildCopy("CUSTOMER COPY", d);
    document.getElementById("officeCopy").innerHTML = buildCopy("OFFICE COPY", d);
    
    setTimeout(() => {
        window.print();
    }, 600);
}

function searchData() {
    const id = document.getElementById("searchId").value.trim();
    const sBtn = document.getElementById("searchBtn");
    
    if (!id) return alert("Sila masukkan No. RSF");

    sBtn.disabled = true;
    sBtn.innerText = "Mencari...";

    fetch(scriptURL + "?id=" + id)
    .then(r => r.json())
    .then(d => {
        if (d.result === "not_found") {
            alert("Data tidak dijumpai!");
        } else {
            printReceipt({
                id: d.id,
                branch: d.branch,
                staff: d.staff,
                model: d.model,
                name: d.name,
                phone: d.phone,
                issue: d.issue, // Data masalah dari carian
                address: d.address,
                status: d.status
            });
        }
        sBtn.disabled = false;
        sBtn.innerText = "CARI & CETAK";
    })
    .catch(err => {
        alert("Ralat semasa mencari data.");
        sBtn.disabled = false;
        sBtn.innerText = "CARI & CETAK";
    });
}
</script>

</body>
</html>
