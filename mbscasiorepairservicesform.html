<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO Repair System | MBS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #004085; text-transform: uppercase; border-bottom: 3px solid #004085; padding-bottom: 10px; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #dee2e6; border-radius: 8px; }
        .note { background: #ffc107; color: #000; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-submit { background-color: #28a745; color: white; }
        .btn-submit:hover { background-color: #218838; }
        .btn-search { background-color: #007bff; color: white; }
        .btn-search:hover { background-color: #0069d9; }
        .search-area { background: #f1f3f5; }
    </style>
</head>
<body>

<div class="container">
    <h2>CASIO Repair Services Form</h2>
    
    <div class="section">
        <div class="note">NOTA: HANYA TERIMA CASIO CALCULATOR YANG BELI DI MBS SAHAJA.</div>
        <form id="repairForm">
            <label>Diterima Oleh Cawangan:</label>
            <input type="text" id="branch" placeholder="Contoh: MBS Kuantan" required>
            
            <label>Diterima Oleh Staff (Nama):</label>
            <input type="text" id="staff" placeholder="Nama staff bertugas" required>

            <label>Model Kalkulator:</label>
            <input type="text" id="calcModel" placeholder="Contoh: fx-570MS / fx-991CW" required>
            
            <label>Nama Pelanggan:</label>
            <input type="text" id="custName" placeholder="Nama penuh pelanggan" required>
            
            <label>No. Telefon:</label>
            <input type="text" id="custPhone" placeholder="Contoh: 0123456789" required>
            
            <label>Alamat Pelanggan:</label>
            <textarea id="custAddress" rows="3" placeholder="Alamat lengkap"></textarea>
            
            <button type="submit" class="btn-submit">SIMPAN DATA & CETAK PDF</button>
        </form>
    </div>

    <div class="section search-area">
        <h3>Carian Status & Reprint</h3>
        <p style="font-size: 13px;">Masukkan nombor RSF untuk semak status atau cetak semula resit.</p>
        <input type="text" id="searchId" placeholder="RSF0000001">
        <button onclick="searchData()" class="btn-search">CARI & REPRINT</button>
        <div id="searchResult" style="margin-top:15px; display:none; padding:15px; background:#fff; border-left:5px solid #007bff;">
            <div id="resultContent"></div>
            <button id="reprintBtn" style="background:#6c757d; color:white; padding:8px; margin-top:10px;">DOWNLOAD PDF SEMULA</button>
        </div>
    </div>
</div>

<script>
    // GANTIKAN URL DI BAWAH DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxSQILLf9u9Jt8-wwVZwdiyk9z0v3NTQBIxjA6CVjgj_B9hw3wW-ccbvvIfFeU1y1Nrqw/exec';

    // Proses Submit Form
    document.getElementById('repairForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.innerText = "Sila tunggu...";

        const data = {
            branch: document.getElementById('branch').value,
            staff: document.getElementById('staff').value,
            calcModel: document.getElementById('calcModel').value,
            custName: document.getElementById('custName').value,
            custPhone: document.getElementById('custPhone').value,
            custAddress: document.getElementById('custAddress').value
        };

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
        .then(res => res.json())
        .then(response => {
            alert('Berjaya Simpan! ID: ' + response.id);
            generatePDF(response.id, data.branch, data.staff, data.custName, data.custPhone, data.custAddress, data.calcModel, "PENDING");
            e.target.reset();
            btn.disabled = false;
            btn.innerText = "SIMPAN DATA & CETAK PDF";
        })
        .catch(error => {
            console.error('Error!', error.message);
            btn.disabled = false;
            btn.innerText = "SIMPAN DATA & CETAK PDF";
        });
    });

    // Fungsi Carian
    function searchData() {
        const id = document.getElementById('searchId').value;
        const resDiv = document.getElementById('searchResult');
        if(!id) return alert("Sila masukkan RSF Number");

        fetch(scriptURL + "?id=" + id)
        .then(res => res.json())
        .then(data => {
            if(data.result === "not_found") {
                alert("Nombor RSF tidak dijumpai!");
                resDiv.style.display = "none";
            } else {
                resDiv.style.display = "block";
                document.getElementById('resultContent').innerHTML = `
                    <strong>Status:</strong> ${data.status}<br>
                    <strong>Model:</strong> ${data.model}<br>
                    <strong>Nama:</strong> ${data.name}
                `;
                document.getElementById('reprintBtn').onclick = () => {
                    generatePDF(data.id, data.branch, data.staff, data.name, data.phone, data.address, data.model, data.status);
                };
            }
        });
    }

    // Fungsi Generate PDF (A4 Landscape - Double Kiri Kanan)
    function generatePDF(id, branch, staff, name, phone, address, model, status) {
        const template = `
            <div style="display: flex; width: 277mm; font-family: Arial, sans-serif; padding: 10px; background: white;">
                ${[1, 2].map(i => `
                    <div style="flex: 1; border: 2px dashed #000; margin: 5px; padding: 15px; position: relative;">
                        <center>
                            <h2 style="margin:0; font-size:18px;">MBS BOOKS & STATIONERY</h2>
                            <p style="margin:2px; font-size:12px;">REPAIR SERVICES FORM (${i === 1 ? 'CUSTOMER COPY' : 'SHOP COPY'})</p>
                        </center>
                        <hr>
                        <table style="width:100%; font-size:13px; line-height:1.6;">
                            <tr><td width="35%"><strong>RSF NUMBER</strong></td><td>: <span style="font-size:16px; font-weight:bold;">${id}</span></td></tr>
                            <tr><td><strong>CAWANGAN</strong></td><td>: ${branch}</td></tr>
                            <tr><td><strong>STAFF</strong></td><td>: ${staff}</td></tr>
                            <tr><td colspan="2"><hr></td></tr>
                            <tr><td><strong>CUSTOMER NAME</strong></td><td>: ${name}</td></tr>
                            <tr><td><strong>PHONE NO</strong></td><td>: ${phone}</td></tr>
                            <tr><td><strong>MODEL</strong></td><td>: ${model}</td></tr>
                            <tr><td><strong>STATUS</strong></td><td>: ${status}</td></tr>
                            <tr><td valign="top"><strong>ADDRESS</strong></td><td>: ${address}</td></tr>
                        </table>
                        <br><br>
                        <div style="font-size:10px; border-top: 1px solid #ccc; padding-top:5px;">
                            Tarikh Cetak: ${new Date().toLocaleString('ms-MY')}<br>
                            * Sila bawa resit ini semasa menuntut barang.
                        </div>
                    </div>
                `).join('')}
            </div>
        `;

        const opt = {
            margin: 0,
            filename: id + '_MBS.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };

        html2pdf().from(template).set(opt).save();
    }
</script>

</body>
</html>
