<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Order System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-color: #4facfe;
        --secondary-color: #00f2fe;
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --text-color: #333;
    }

    body { 
        font-family: 'Poppins', sans-serif; 
        background-color: var(--bg-color); 
        margin: 0; padding: 0;
        display: flex; justify-content: center;
    }

    /* 容器：在电脑端自动变宽，手机端满屏 */
    .container {
        width: 100%;
        max-width: 900px; /* 增加最大宽度以适应电脑端多列 */
        background: var(--card-bg);
        min-height: 100vh;
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
        padding: 20px;
        box-sizing: border-box;
    }

    h2 { text-align: center; color: #444; margin-bottom: 20px; }

    /* Tabs */
    .tabs { 
        display: flex; background: #e4e6eb; padding: 5px; 
        border-radius: 12px; margin-bottom: 25px;
        max-width: 400px; margin-left: auto; margin-right: auto;
    }
    .tabs button { 
        flex: 1; border: none; padding: 10px; cursor: pointer; 
        background: transparent; font-weight: 600; color: #65676b;
        border-radius: 8px; transition: 0.3s;
    }
    .tabs button.active { 
        background: white; color: var(--primary-color);
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* Tab 内容动画 */
    .tab { display: none; animation: fadeIn 0.4s ease; }
    .tab.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 上传表单样式优化 */
    .upload-box { max-width: 500px; margin: 0 auto; }
    input[type="file"] {
        width: 100%; background: #f1f3f5; border: 2px dashed #ccd0d5;
        padding: 30px; border-radius: 12px; box-sizing: border-box;
    }
    #preview { 
        width: 100%; border-radius: 12px; margin-top: 15px; 
        display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    textarea { 
        width: 100%; padding: 12px; margin-top: 15px; border: 1px solid #ddd; 
        border-radius: 12px; resize: none; box-sizing: border-box; font-family: inherit;
    }
    .btn-save { 
        width: 100%; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white; border: none; padding: 15px; border-radius: 12px;
        font-size: 16px; font-weight: 600; margin-top: 15px; cursor: pointer;
    }

    /* --- 核心修改：预览网格布局 --- */
    #list {
        display: grid;
        gap: 15px; /* 格子间距 */
        /* 默认手机端：一行两个 (1fr 1fr) */
        grid-template-columns: repeat(2, 1fr); 
    }

    /* 电脑端适配：宽度大于 768px 时一行四个 */
    @media (min-width: 768px) {
        #list { grid-template-columns: repeat(4, 1fr); }
    }

    .record { 
        background: #fff; border: 1px solid #eee; border-radius: 12px;
        overflow: hidden; display: flex; flex-direction: column;
        transition: transform 0.2s;
    }
    .record:hover { transform: translateY(-3px); }

    /* 让图片/iframe 变成正方形或固定比例 */
    .record iframe { 
        border: none; width: 100%; height: 150px; /* 缩窄高度适合小图 */
        background: #eee;
    }

    .record-info { padding: 8px; flex-grow: 1; }
    .record-remark { 
        font-size: 13px; font-weight: 600; color: #333; 
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; /* 文字过长显示省略号 */
    }
    .record-time { font-size: 10px; color: #999; margin-top: 4px; }
</style>
</head>
<body>

<div class="container">
    <h2>📸 Photo Order</h2>

    <div class="tabs">
        <button id="btn1" class="active" onclick="showTab(1)">📷 Upload</button>
        <button id="btn2" onclick="showTab(2)">📂 Preview</button>
    </div>

    <div id="tab1" class="tab active">
        <div class="upload-box">
            <input type="file" id="camera" accept="image/*" capture="environment">
            <img id="preview" src="">
            <textarea id="remark" rows="3" placeholder="Write some remarks..."></textarea>
            <button class="btn-save" onclick="upload()">💾 Save Record</button>
        </div>
    </div>

    <div id="tab2" class="tab">
        <div id="list">Loading...</div>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKseOaWXl9GECVNfKUij0s6o3Fj4rfGFXriwdmkBFi8p0PPJ4hPTK8IK2Hxar2GhVg/exec";
let compressedImage = "";

function showTab(n){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById("tab"+n).classList.add("active");
    document.getElementById("btn"+n).classList.add("active");
    if(n===2) loadPreview();
}

document.getElementById("camera").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    img.onload = () => compress(img);
    img.src = URL.createObjectURL(file);
});

function compress(img){
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const maxWidth = 800; // 预览缩略图不需要太大
    const scale = Math.min(maxWidth / img.width, 1);
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    compressedImage = canvas.toDataURL("image/jpeg", 0.6);
    const previewImg = document.getElementById("preview");
    previewImg.src = compressedImage;
    previewImg.style.display = "block";
}

function upload(){
    if(!compressedImage){ alert("Please take a photo!"); return; }
    const btn = document.querySelector(".btn-save");
    btn.innerText = "⌛ Uploading..."; btn.disabled = true;
    const remark = document.getElementById("remark").value;

    fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ image: compressedImage, remark: remark })
    })
    .then(r => r.text())
    .then(msg => {
        alert("Success!");
        compressedImage = "";
        document.getElementById("camera").value = "";
        document.getElementById("preview").style.display = "none";
        document.getElementById("remark").value = "";
        btn.innerText = "💾 Save Record"; btn.disabled = false;
    })
    .catch(err => { alert("Error: " + err); btn.disabled = false; });
}

function loadPreview(){
    const listDiv = document.getElementById("list");
    listDiv.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Loading...</p>";
    
    fetch(SCRIPT_URL)
    .then(r => r.json())
    .then(data => {
        listDiv.innerHTML = "";
        if(data.length === 0){ listDiv.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No records.</p>"; return; }
        
        data.reverse().forEach(row => {
            const div = document.createElement("div");
            div.className = "record";
            div.innerHTML = `
                <iframe src="${row.image}" scrolling="no"></iframe>
                <div class="record-info">
                    <div class="record-remark" title="${row.remark}">${row.remark || 'No remark'}</div>
                    <div class="record-time">${row.time}</div>
                </div>
            `;
            listDiv.appendChild(div);
        });
    })
    .catch(err => { listDiv.innerHTML = "Failed to load: " + err; });
}
</script>

</body>
</html>
