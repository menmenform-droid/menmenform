<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China Order System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .preview-img { width: 100%; max-height: 300px; object-fit: contain; display: none; margin-bottom: 10px; }
        .loader { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h3 class="text-center mb-4">China Order System</h3>
        
        <ul class="nav nav-pills nav-fill mb-4" id="pills-tab">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-snap">Ambil Gambar</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-list" onclick="fetchList()">Check List</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-snap">
                <div class="card p-3 shadow-sm">
                    <input type="file" id="cameraInput" accept="image/*" capture="camera" class="form-control mb-3">
                    <img id="itemPreview" class="preview-img img-thumbnail">
                    <textarea id="remarkInput" class="form-control mb-3" placeholder="Masukkan Remark / Info Barang"></textarea>
                    <button id="btnSave" onclick="saveData()" class="btn btn-primary w-100">SIMPAN KE GOOGLE SHEET</button>
                    <div id="saveLoader" class="text-center mt-2 loader text-primary">Menyimpan... Sila tunggu.</div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-list">
                <div id="listArea" class="row g-3">
                    <p class="text-center">Klik 'Check List' untuk muat turun data.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKseOaWXl9GECVNfKUij0s6o3Fj4rfGFXriwdmkBFi8p0PPJ4hPTK8IK2Hxar2GhVg/exec";
        let base64Image = "";

        // Handle Kamera & Image Compression (~100kb)
        document.getElementById('cameraInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const max = 800;
                    if (width > height) { if (width > max) { height *= max / width; width = max; } }
                    else { if (height > max) { width *= max / height; height = max; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    base64Image = canvas.toDataURL("image/jpeg", 0.7); // 0.7 quality = ~100kb
                    document.getElementById('itemPreview').src = base64Image;
                    document.getElementById('itemPreview').style.display = "block";
                }
            };
            reader.readAsDataURL(file);
        });

        // Fungsi Simpan (POST)
        async function saveData() {
            const remark = document.getElementById('remarkInput').value;
            if (!base64Image) return alert("Sila ambil gambar dulu!");
            
            document.getElementById('btnSave').disabled = true;
            document.getElementById('saveLoader').style.display = "block";

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors", // Penting untuk Google Apps Script
                    body: JSON.stringify({ image: base64Image, remark: remark })
                });
                alert("Data dihantar! Sila semak Google Sheet.");
                location.reload();
            } catch (err) {
                alert("Ralat: " + err);
                document.getElementById('btnSave').disabled = false;
            }
        }

        // Fungsi Ambil Data (GET)
        async function fetchList() {
            const listArea = document.getElementById('listArea');
            listArea.innerHTML = "Memuatkan data...";
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                let html = "";
                data.slice(1).reverse().forEach(row => {
                    html += `
                        <div class="col-6 col-md-4">
                            <div class="card h-100 shadow-sm">
                                <img src="${row[1]}" class="card-img-top" style="height:150px; object-fit:cover;">
                                <div class="card-body p-2">
                                    <small class="text-muted" style="font-size:10px;">${new Date(row[0]).toLocaleString()}</small>
                                    <p class="card-text small fw-bold">${row[2] || 'Tiada Remark'}</p>
                                </div>
                            </div>
                        </div>`;
                });
                listArea.innerHTML = html || "Tiada data ditemui.";
            } catch (err) {
                listArea.innerHTML = "Gagal memuatkan data.";
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
