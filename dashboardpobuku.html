<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard PO Stationery</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #27ae60;
            --info: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--primary);
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        /* Status Berkelip */
        .pending-blink {
            color: var(--accent);
            font-weight: bold;
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .status-text {
            color: #555;
            font-style: italic;
            font-weight: 500;
        }

        /* Button Styling */
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.3s;
            margin-right: 5px;
        }

        .btn-print { background-color: var(--info); }
        .btn-print:hover { background-color: #2980b9; }

        .btn-kutip { background-color: var(--success); }
        .btn-kutip:hover { background-color: #219150; }

        .loading { text-align: center; padding: 20px; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Dashboard PO Buku</h2>
    <div id="statusUpdate" style="text-align: center; font-size: 12px; color: #999; margin-bottom: 10px;">
        Auto-refresh aktif (30s)
    </div>
    
    <div id="mainContent">
        <div class="loading">Sila tunggu, sedang memuatkan data...</div>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyIZPuERQCBY5ABYepIPLVTxXL2rAGxAt1vi9PMOCabWJFz_YOFCIbySTarJfOxqKbu0A/exec";

    // Fungsi Ambil Data
    async function fetchData() {
        try {
            const response = await fetch(`${WEB_APP_URL}?action=getData`);
            const data = await response.json();
            renderTable(data);
        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('mainContent').innerHTML = "<p style='color:red; text-align:center;'>Gagal bersambung ke Google Sheets. Pastikan URL Web App betul.</p>";
        }
    }

    // Fungsi Papar Jadual
    function renderTable(data) {
        if (data.length === 0) {
            document.getElementById('mainContent').innerHTML = "<div class='loading'>✅ Tiada PO pending buat masa ini.</div>";
            return;
        }

        let html = `<table>
            <thead>
                <tr>
                    <th>Cawangan</th>
                    <th>Nombor PO</th>
                    <th>Status H</th>
                    <th>Tindakan</th>
                </tr>
            </thead>
            <tbody>`;

        data.forEach(item => {
            let statusDisplay = item.status === "" || item.status === null 
                ? '<span class="pending-blink">⚠ PENDING</span>' 
                : `<span class="status-text">${item.status}</span>`;

            html += `<tr>
                <td><strong>${item.cawangan}</strong></td>
                <td>${item.noPo}</td>
                <td>${statusDisplay}</td>
                <td>
                    <button class="btn btn-print" onclick="handleAction(${item.row}, 'PRINT', '${item.fileUrl}')">🖨️ Print</button>
                    <button class="btn btn-kutip" onclick="handleAction(${item.row}, 'KUTIP')">🚚 Kutip</button>
                </td>
            </tr>`;
        });

        html += `</tbody></table>`;
        document.getElementById('mainContent').innerHTML = html;
    }

    // Fungsi Print / Kutip
    async function handleAction(row, type, fileUrl) {
        let promptMsg = type === 'PRINT' ? "Masukkan nama (Print by):" : "Masukkan nama (Done kutip by):";
        let staffName = prompt(promptMsg);

        if (staffName && staffName.trim() !== "") {
            // Jika Print, buka PDF di tab baru
            if (type === 'PRINT' && fileUrl && fileUrl !== "undefined") {
                window.open(fileUrl, '_blank');
            }

            // Hantar kemas kini ke Google Sheets
            document.getElementById('mainContent').innerHTML = "<div class='loading'>Mengemaskini data...</div>";
            
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Untuk bypass CORS simple request
                    body: JSON.stringify({
                        row: row,
                        action: type,
                        name: staffName
                    })
                });
                
                // Tunggu sekejap dan refresh data
                setTimeout(fetchData, 1500);
            } catch (error) {
                alert("Ralat kemas kini!");
                fetchData();
            }
        }
    }

    // Initial Load
    fetchData();

    // Auto Refresh setiap 30 saat
    setInterval(fetchData, 30000);
</script>

</body>
</html>
