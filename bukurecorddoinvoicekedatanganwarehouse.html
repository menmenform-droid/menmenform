<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Rekod Warehouse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f7f9; padding: 20px; font-family: sans-serif; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; color: #007bff; margin-bottom: 30px; font-weight: bold; }
        #preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        #preview img { width: 70px; height: 90px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; }
        .loading { display: none; text-align: center; margin-top: 20px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header">REKOD MASUK GUDANG</h2>
    
    <form id="recordForm">
        <div class="form-group">
            <label>Nama Staff</label>
            <input type="text" id="staff" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Nama Vendor</label>
            <input type="text" id="vendor" class="form-control" required>
        </div>

        <div class="form-row">
            <div class="form-group col-6">
                <label>Jenis Dokumen</label>
                <select id="docType" class="form-control">
                    <option>DO</option>
                    <option>Invoice</option>
                </select>
            </div>
            <div class="form-group col-6">
                <label>No. Dokumen</label>
                <input type="text" id="docNo" class="form-control" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group col-4">
                <label>Jenis Barang</label>
                <select id="itemType" class="form-control">
                    <option>Stationery</option>
                    <option>Buku</option>
                </select>
            </div>
            <div class="form-group col-4">
                <label>Kuantiti</label>
                <input type="number" id="qty" class="form-control" required>
            </div>
            <div class="form-group col-4">
                <label>Unit</label>
                <select id="unit" class="form-control">
                    <option>Carton</option>
                    <option>Pallet</option>
                </select>
            </div>
        </div>

        <div class="form-group border p-3 rounded bg-light">
            <label><b>Ambil Gambar (Satu-per-Satu)</b></label>
            <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
            <button type="button" class="btn btn-info btn-block" onclick="document.getElementById('fileInput').click()">
                + Buka Kamera / Tambah Halaman
            </button>
            <p class="mt-2 mb-0"><small>Jumlah Gambar: <span id="count">0</span> / 50</small></p>
            <div id="preview"></div>
        </div>

        <button type="button" id="submitBtn" onclick="hantarData()" class="btn btn-primary btn-lg btn-block">SIMPAN REKOD</button>
        
        <div id="loading" class="loading">
            <div class="spinner-border spinner-border-sm"></div> Memproses & Menyemak Duplicate...
        </div>
    </form>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRlNe2kmKGxITL6KlUb8tkYCDKHmlliliaGVZ6x-7IfEXJ-AUyyyOouBKVFK2e2y8i/exec";
    
    let imageArray = [];

    // Fungsi tangkap gambar dan compress
    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const files = e.target.files;
        if (files.length === 0) return;

        for (let file of files) {
            const compressed = await compressImage(file);
            imageArray.push(compressed);
            
            // Tampil preview
            const img = document.createElement('img');
            img.src = compressed.data;
            document.getElementById('preview').appendChild(img);
        }
        document.getElementById('count').innerText = imageArray.length;
        this.value = ""; // Reset supaya boleh guna butang yang sama
    });

    async function hantarData() {
        const btn = document.getElementById('submitBtn');
        const load = document.getElementById('loading');
        
        if (!document.getElementById('docNo').value || imageArray.length === 0) {
            alert("Lengkapkan No. Dokumen dan ambil gambar!");
            return;
        }

        btn.disabled = true;
        load.style.display = "block";

        const payload = {
            staff: document.getElementById('staff').value,
            vendor: document.getElementById('vendor').value,
            docType: document.getElementById('docType').value,
            docNo: document.getElementById('docNo').value,
            itemType: document.getElementById('itemType').value,
            qty: document.getElementById('qty').value,
            unit: document.getElementById('unit').value,
            files: imageArray
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const text = await response.text();
            
            if (text.includes("REJECTED")) {
                alert(text);
            } else {
                alert("Berjaya Disimpan!");
                location.reload(); // Reset form
            }
        } catch (err) {
            alert("Ralat atau Duplicate: Semak Google Sheet anda.");
        } finally {
            btn.disabled = false;
            load.style.display = "none";
        }
    }

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve({
                        data: canvas.toDataURL('image/jpeg', 0.7),
                        name: "Page_" + (imageArray.length + 1) + ".jpg",
                        type: "image/jpeg"
                    });
                };
            };
        });
    }
</script>

</body>
</html>
