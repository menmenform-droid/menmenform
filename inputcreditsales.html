<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Credit Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-overlay { display: none; background: rgba(0,0,0,0.8); position: fixed; inset: 0; z-index: 9999; justify-content: center; align-items: center; color: white; flex-direction: column; }
        input:focus, select:focus { border-color: #2563eb !important; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    
    <div id="loader" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-400 border-t-transparent mb-4"></div>
        <p id="loaderText" class="font-black tracking-widest text-sm uppercase">Sila Tunggu...</p>
    </div>

    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
            <div class="bg-blue-600 p-8 text-center">
                <h2 class="text-2xl font-black text-white uppercase tracking-tighter">Pendaftaran Credit Sales</h2>
                <p class="text-blue-100 text-xs font-bold uppercase tracking-widest mt-1">Borang Serahan Dokumen Cawangan</p>
            </div>

            <form id="mainForm" onsubmit="handleFormSubmit(event)" class="p-8 space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Cawangan</label>
                        <input type="text" name="branch" placeholder="Contoh: HQ / Kuantan" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Nama Staff (Pendaftar)</label>
                        <input type="text" name="staff" placeholder="Nama anda" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Salesman</label>
                        <input type="text" name="salesman" placeholder="Nama Salesman" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Sekolah / Company</label>
                        <input type="text" name="school" placeholder="Nama Sekolah/Company" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Penerima (Nickname)</label>
                        <input type="text" name="nickname" placeholder="Nickname pelanggan" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">No Telefon</label>
                        <input type="tel" name="phone" placeholder="Contoh: 0123456789" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Jenis Dokumen</label>
                        <select name="actionType" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none transition-all font-bold text-slate-700 cursor-pointer">
                            <option value="SALES ORDER">SALES ORDER</option>
                            <option value="INVOICE">INVOICE</option>
                            <option value="STOCK TRANSFER">STOCK TRANSFER</option>
                            <option value="DELIVERY ORDER">DELIVERY ORDER</option>
                            <option value="RETURN CN">RETURN CN</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">No Document / DO</label>
                        <input type="text" name="docNo" placeholder="Contoh: DO-12345" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none transition-all font-semibold text-slate-700" required>
                    </div>
                </div>

                <div class="mt-4 p-6 bg-blue-50 rounded-3xl border-2 border-dashed border-blue-200 text-center group hover:border-blue-400 transition-all">
                    <label class="block text-sm font-black text-blue-700 mb-2 uppercase tracking-tight">📸 Lampirkan Gambar / Dokumen</label>
                    <input type="file" id="imageFiles" accept="image/*" multiple capture="environment" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-black file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                    <p class="text-[9px] text-blue-400 mt-3 font-bold uppercase italic">Sistem akan mengompres gambar secara automatik</p>
                </div>

                <button type="submit" class="w-full bg-slate-800 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-black hover:-translate-y-1 transition-all uppercase tracking-widest text-sm">
                    Hantar Rekod Sekarang 🚀
                </button>
            </form>
        </div>
        
        <p class="text-center mt-6 text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Sistem Tracking Credit Sales v3.4</p>
    </div>

    <script>
        // MASUKKAN URL WEB APP ANDA DI SINI
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxreXhv__TCtjnyxFqhCrRbjyqSlGytoTxJh6KN8QkTwDk2xY8ysOKfMmpBCJfvFyUV/exec";

        async function handleFormSubmit(e) {
            e.preventDefault();
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            
            // Konfirmasi sebelum hantar
            if(!confirm("Pastikan semua maklumat betul sebelum hantar?")) return;

            loader.style.display = 'flex';
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.images = [];

            const files = document.getElementById('imageFiles').files;
            
            try {
                // Proses Gambar dengan Compression
                for (let i = 0; i < files.length; i++) {
                    loaderText.innerText = `Memproses Fail ${i+1}/${files.length}...`;
                    const compressed = await compressImage(files[i]);
                    data.images.push(compressed);
                }

                loaderText.innerText = "Menghantar Data...";
                
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(data) 
                });

                alert('✅ Rekod berjaya dihantar!');
                e.target.reset();
            } catch (err) { 
                alert('❌ Ralat berlaku! Sila cuba lagi.'); 
                console.error(err);
            } finally { 
                loader.style.display = 'none'; 
            }
        }

        // Fungsi Kompres Gambar (Maksimum lebar 1000px, Kualiti 0.7)
        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const scale = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }
    </script>
</body>
</html>
