<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Credit Sales v3.5.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-overlay { display: none; background: rgba(0,0,0,0.85); position: fixed; inset: 0; z-index: 9999; justify-content: center; align-items: center; color: white; flex-direction: column; }
        #whatsappBtn { display: none; }
        .preview-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 15px; }
        .preview-box { position: relative; width: 100%; height: 100px; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 2px solid #e2e8f0; }
        .remove-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid white; }
        input:focus, select:focus { border-color: #2563eb !important; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-800">
    
    <div id="loader" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-400 border-t-transparent mb-4"></div>
        <p id="loaderStatus" class="font-black tracking-widest text-sm uppercase mb-2">Sila Tunggu...</p>
        <div class="w-48 bg-slate-700 rounded-full h-1.5 mb-1">
            <div id="progressBar" class="bg-blue-400 h-1.5 rounded-full transition-all" style="width: 0%"></div>
        </div>
        <p id="progressText" class="text-[10px] font-bold text-slate-400">0% DIPROSES</p>
    </div>

    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
            <div class="bg-blue-600 p-8 text-center">
                <h2 class="text-2xl font-black text-white uppercase tracking-tighter italic">Credit Sales Registration</h2>
                <p class="text-blue-100 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">Multi-Image Support (Add one by one)</p>
            </div>

            <form id="mainForm" onsubmit="handleFormSubmit(event)" class="p-8 space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Cawangan</label>
                        <input type="text" name="branch" id="branch" placeholder="HQ / Kuantan" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Nama Staff (Pendaftar)</label>
                        <input type="text" name="staff" id="staff" placeholder="Nama anda" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Salesman</label>
                        <input type="text" name="salesman" id="salesman" placeholder="Nama Salesman" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Sekolah / Company</label>
                        <input type="text" name="school" id="school" placeholder="Nama Sekolah/Company" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Penerima (Nickname)</label>
                        <input type="text" name="nickname" id="nickname" placeholder="Nama pelanggan" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">No Telefon</label>
                        <input type="tel" name="phone" id="phone" placeholder="Contoh: 0123456789" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Jenis Dokumen</label>
                        <select name="actionType" id="actionType" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold cursor-pointer text-blue-600">
                            <option>SALES ORDER</option>
                            <option>INVOICE</option>
                            <option>STOCK TRANSFER</option>
                            <option>DELIVERY ORDER</option>
                            <option>RETURN CN</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">No Document / DO</label>
                        <input type="text" name="docNo" id="docNo" placeholder="No Dokumen" class="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold" required>
                    </div>
                </div>

                <div class="mt-4 p-6 bg-slate-100 rounded-3xl border-2 border-dashed border-slate-300 text-center relative hover:bg-slate-200 transition-all">
                    <label class="block text-sm font-black text-slate-700 mb-2 uppercase tracking-tight">📸 Lampirkan Dokumen (Satu demi Satu)</label>
                    <input type="file" id="imageFiles" accept="image/*" capture="environment" class="hidden">
                    <button type="button" onclick="document.getElementById('imageFiles').click()" class="bg-white border-2 border-blue-600 text-blue-600 font-black px-6 py-2 rounded-xl hover:bg-blue-50 transition-all uppercase text-xs shadow-sm">
                        + Ambil Gambar Baru
                    </button>
                    <p class="text-[10px] text-slate-400 mt-2 font-black uppercase tracking-widest italic">JUMLAH: <span id="imgCount" class="text-blue-600">0</span> / 50 GAMBAR</p>
                    <div id="previewArea" class="preview-container"></div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-blue-700 hover:-translate-y-1 transition-all uppercase tracking-widest text-sm">
                    Hantar & Simpan Rekod 🚀
                </button>

                <button type="button" id="whatsappBtn" onclick="shareWhatsApp()" class="w-full bg-green-500 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-green-600 transition-all uppercase tracking-widest text-sm flex items-center justify-center gap-2">
                    📲 Share to WhatsApp Group
                </button>
            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxreXhv__TCtjnyxFqhCrRbjyqSlGytoTxJh6KN8QkTwDk2xY8ysOKfMmpBCJfvFyUV/exec";
        
        // Array global untuk simpan gambar
        let allImages = [];
        let lastSavedData = null;

        // Listener untuk tambah gambar tanpa replace yang lama
        document.getElementById('imageFiles').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            document.getElementById('loaderStatus').innerText = "MEMPROSES GAMBAR...";

            for (let file of files) {
                if (allImages.length >= 50) {
                    alert("Maksimum 50 gambar sahaja!");
                    break;
                }
                const compressed = await compressImage(file);
                allImages.push(compressed);
            }

            renderPreviews();
            this.value = ""; // Benarkan snap semula gambar yang sama/baru
            loader.style.display = 'none';
        });

        function renderPreviews() {
            const area = document.getElementById('previewArea');
            area.innerHTML = "";
            document.getElementById('imgCount').innerText = allImages.length;

            allImages.forEach((imgData, index) => {
                const box = document.createElement('div');
                box.className = "preview-box";
                box.innerHTML = `
                    <img src="${imgData}" class="preview-img">
                    <div class="remove-btn" onclick="removeImage(${index})">×</div>
                `;
                area.appendChild(box);
            });
        }

        function removeImage(index) {
            allImages.splice(index, 1);
            renderPreviews();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (allImages.length === 0) return alert("Sila ambil sekurang-kurangnya 1 gambar!");

            const loader = document.getElementById('loader');
            const btn = document.getElementById('submitBtn');
            
            loader.style.display = 'flex';
            document.getElementById('loaderStatus').innerText = "SEDANG MENGHANTAR DATA...";
            btn.disabled = true;

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.images = allImages; // Hantar array gambar yang dikumpul

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert('✅ Rekod Berjaya Disimpan!');
                    lastSavedData = {...data, folderUrl: result.folderUrl, timestamp: result.timestamp};
                    btn.style.display = "none";
                    document.getElementById('whatsappBtn').style.display = "flex";
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                alert('❌ Ralat: ' + err.message);
                btn.disabled = false;
            } finally {
                loader.style.display = 'none';
            }
        }

        function shareWhatsApp() {
            if (!lastSavedData) return;
            const msg = `📄 *[${lastSavedData.timestamp}]*%0Acawangan *[${lastSavedData.branch.toUpperCase()}]* keluarkan *[${lastSavedData.actionType}]* no:*[${lastSavedData.docNo.toUpperCase()}]* dibawah salesman *[${lastSavedData.salesman.toUpperCase()}]* kepada *[${lastSavedData.school.toUpperCase()}] [${lastSavedData.nickname.toUpperCase()}] [${lastSavedData.phone}]*, view *[${lastSavedData.folderUrl}]*`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
            if(confirm("Dah share? Ingin buat rekod baru?")) location.reload();
        }

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const scale = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }
    </script>
</body>
</html>
